<!-- JSON-LD for / (Home). Paste into the <head> of the home page. FAQ text must stay identical to the visible FAQ (tools/build_site.py FAQ list; checked at build time). -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "LegalService",
      "@id": "https://10flatlaw.com/#firm",
      "name": "10flat",
      "url": "https://10flatlaw.com/",
      "telephone": "[WHATSAPP NUMBER]",
      "email": "[EMAIL]",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "[STREET ADDRESS]",
        "addressLocality": "[CITY]",
        "addressRegion": "TX",
        "postalCode": "[ZIP]",
        "addressCountry": "US"
      },
      "areaServed": "Texas",
      "priceRange": "Attorney fee: 10% of the amount recovered, calculated after case costs. No fee and no costs if there is no recovery. The fee stays 10% at trial.",
      "knowsAbout": [
        "Car accidents",
        "Medical injury",
        "Dental injury"
      ]
    },
    {
      "@type": "WebSite",
      "@id": "https://10flatlaw.com/#website",
      "url": "https://10flatlaw.com/",
      "name": "10flat",
      "publisher": {
        "@id": "https://10flatlaw.com/#firm"
      },
      "inLanguage": "en"
    },
    {
      "@type": "FAQPage",
      "@id": "https://10flatlaw.com/#faq",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is the attorney fee?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "10% of the amount recovered, calculated after case costs are repaid. It never goes up, even if we go to trial. Most injury firms take 33–40%."
          }
        },
        {
          "@type": "Question",
          "name": "Which cases qualify?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Injury cases such as car accidents and medical or dental injury claims. A licensed Texas attorney reviews every request, usually [the same day], and may accept or decline it. It’s free to find out if we can help."
          }
        },
        {
          "@type": "Question",
          "name": "What does it cost to start?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Nothing. If there is no recovery, you owe no fee and no case costs. There is no markup on case costs and no admin fees. Medical bills and liens are paid from your recovery the same way at any firm."
          }
        },
        {
          "@type": "Question",
          "name": "Why is the fee lower?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Because we spend less, not because we do less. Technology handles the paperwork that other firms pay staff to do: organising records, building a treatment timeline, totalling bills, drafting letters and tracking deadlines. We don’t spend your money on TV ads or a fancy office."
          }
        },
        {
          "@type": "Question",
          "name": "Does a lower fee mean a smaller settlement?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. The insurance company decides how much to pay based on your injuries, your medical bills, the facts and the insurance coverage, not on what your lawyer charges. What the fee changes is how much of the settlement you keep."
          }
        },
        {
          "@type": "Question",
          "name": "How does the fee calculator work?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Choose a case type and type or slide to a settlement amount. The calculator shows example case costs, our 10% fee, the fee at a 33% firm and how much more you keep. Fees are figured after case costs at both firms. It is an example only; every case is different."
          }
        },
        {
          "@type": "Question",
          "name": "Who represents me?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "A licensed Texas attorney is responsible for your case, and you choose your attorney from the team members available for it. 10flat uses software, including AI, and a supervised case team to prepare work; a licensed attorney reviews and approves legal work. Contacting us does not create an attorney-client relationship until a fee agreement is signed."
          }
        }
      ]
    }
  ]
}
</script>
